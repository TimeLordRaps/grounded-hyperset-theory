name: conformance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"


jobs:
  base:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: python -m compileall -q src scripts tests

  stdlib-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pure stdlib import smoke
        run: python -S -c "import sys; sys.path.insert(0, 'src'); import grounded_hyperset_theory as ght; assert ght.QuineAtom() in ght.QuineAtom(); assert ght.von_neumann_ordinal(3).cardinality() == 3; print(ght.__version__)"

  release-integrity:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ".[release]"
        shell: bash
      - name: Build and verify the current Python distribution coordinate
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/release_artifacts.py build --ref HEAD --release "$VERSION" --output-dir dist/release-integrity
          python scripts/release_artifacts.py verify "dist/release-integrity/grounded-hyperset-theory-$VERSION.manifest.json"
        shell: bash
      - run: python -m twine check dist/release-integrity/*.whl dist/release-integrity/*.tar.gz
        shell: bash
      - run: python scripts/check_release_boundary.py dist/release-integrity/*.zip dist/release-integrity/*.whl dist/release-integrity/*.tar.gz
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-integrity-${{ matrix.os }}
          path: dist/release-integrity
          if-no-files-found: error
          retention-days: 7

  release-reproducibility:
    needs: [release-integrity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-integrity-ubuntu-latest
          path: dist/ubuntu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-integrity-windows-latest
          path: dist/windows
      - name: Require byte-identical Linux and Windows release artifacts
        run: python scripts/release_artifacts.py compare dist/ubuntu dist/windows

  installed-wheel-smoke:
    needs: [release-integrity]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-integrity-${{ matrix.os }}
          path: dist/release-integrity
      - name: Smoke-test the exact built wheel in an isolated venv
        run: python scripts/check_installed_wheel.py --wheel-dir dist/release-integrity

  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_presentation.py
      - run: python scripts/build_pages.py --output _site

  conformance-gate:
    if: always()
    needs: [base, stdlib-smoke, release-integrity, release-reproducibility, installed-wheel-smoke, presentation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every declared support and artifact check
        env:
          BASE: ${{ needs.base.result }}
          STDLIB: ${{ needs.stdlib-smoke.result }}
          RELEASE: ${{ needs.release-integrity.result }}
          REPRODUCIBLE: ${{ needs.release-reproducibility.result }}
          WHEEL: ${{ needs.installed-wheel-smoke.result }}
          PRESENTATION: ${{ needs.presentation.result }}
        run: |
          test "$BASE" = success
          test "$STDLIB" = success
          test "$RELEASE" = success
          test "$REPRODUCIBLE" = success
          test "$WHEEL" = success
          test "$PRESENTATION" = success
