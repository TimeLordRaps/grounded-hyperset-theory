name: external-link-audit

# The analog of verifier's weekly link audit, with one difference that the
# other repositories force: verifier calls `scripts/check_external_links.py`,
# which exists in exactly one repository. A shared workflow that names one
# repository's script is broken in every other one, so the audit is carried
# inline and reads the tree it is run against.

on:
  schedule:
    - cron: "23 11 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit every external link in every tracked document
        id: audit
        run: python .github/audit_external_links.py --report external-links.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-link-audit-${{ github.run_id }}
          path: external-links.json
          if-no-files-found: error
          retention-days: 14
