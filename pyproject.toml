[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "grounded-hyperset-theory"
version = "0.2.0"
description = "Grounded Hyperset Theory: Accessible Pointed Graphs, non-well-founded sets, constructive membership, meta-features, and calculi bridges"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Tyler Roost"}]
keywords = ["hyperset", "set-theory", "graph-theory", "aczel", "non-well-founded", "calculus", "meta-calculus", "hyper-calculus", "language-calculus", "real-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout>=2.3"]
release = ["build>=1.2", "twine>=6"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.9", "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://github.com/TimeLordRaps/grounded-hyperset-theory"
Repository = "https://github.com/TimeLordRaps/grounded-hyperset-theory"
Issues = "https://github.com/TimeLordRaps/grounded-hyperset-theory/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_hyperset_theory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["dist", ".git", ".venv", "__pycache__"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 100
